<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Vibrant Electric Shield Gradients -->
    <linearGradient id="shield-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <linearGradient id="shield-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="shield-inner-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="shield-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0066ff" flood-opacity="0.45"/>
    </filter>

    <filter id="z-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <path d="M 128 22 C 182 22 216 38 216 52 C 216 142 176 200 128 238 C 80 200 40 142 40 52 C 40 38 74 22 128 22 Z"
        fill="#0066ff" opacity="0.3" filter="url(#shield-glow)"/>

  <!-- Outer Shield Shell -->
  <path d="M 128 24 C 180 24 214 39 214 52 C 214 140 174 196 128 234 C 82 196 42 140 42 52 C 42 39 76 24 128 24 Z"
        fill="url(#shield-bg)"
        stroke="url(#shield-border)"
        stroke-width="5"
        stroke-linejoin="round"/>

  <!-- Inner Subtle Glass Gradient Bevel -->
  <path d="M 128 29 C 176 29 207 43 207 55 C 207 137 170 190 128 226 C 86 190 49 137 49 55 C 49 43 80 29 128 29 Z"
        fill="url(#shield-inner-glow)"/>

  <!-- Iconic Pure White Bold 'Z' Glyph -->
  <g filter="url(#z-shadow)">
    <!-- Modern Dynamic Cut 'Z' -->
    <path d="M 76 86 
             L 178 86 
             C 181 86 183 88.5 182.5 91.5 
             L 177 114 
             C 176.5 116 174.5 117.5 172 117.5 
             L 115 117.5 
             L 179 164 
             C 181 165.5 182 168 182 170 
             L 182 178 
             L 76 178 
             C 73 178 71 175.5 71.5 172.5 
             L 77 150 
             C 77.5 148 79.5 146.5 82 146.5 
             L 141 146.5 
             L 75 99 
             C 73 97.5 72 95 72 93 
             Z" 
          fill="#FFFFFF"/>
  </g>
</svg>
