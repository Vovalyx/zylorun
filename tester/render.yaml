services:
  - type: web
    name: zylorun
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://zylorun-five.vercel.app,https://zylorun.vercel.app
      - key: DATABASE_URL
        value: postgresql+asyncpg://postgres.zrtplsfswxegtigdvery:Fm7P8s7umt4OqqWv@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ZYLORUN_CRON_SECRET
        sync: false

  - type: cron
    name: zylorun-polling-trigger
    runtime: python
    schedule: "* * * * *"
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.workers.cron_trigger"
    envVars:
      - key: GITFLOW_API_URL
        fromService:
          type: web
          name: zylorun
          envVarKey: RENDER_EXTERNAL_URL
      - key: GITFLOW_CRON_SECRET
        fromService:
          type: web
          name: zylorun
          envVarKey: ZYLORUN_CRON_SECRET
